<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de instalación</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 20px; line-height: 1.45; color: #1b2a2e; }
        h1 { font-size: 1.3rem; }
        ul { padding: 0; margin: 0; }
        li { list-style: none; margin: 9px 0; word-break: break-word; }
        .ok { color: #0a6b3a; }
        .mal { color: #a63a1f; font-weight: 600; }
        .info { color: #5b6b6e; }
        #resumen { margin-top: 22px; padding: 14px; border-radius: 8px; background: #eef3f1; }
    </style>
</head>
<body>
    <h1>Diagnóstico: ¿es instalable?</h1>
    <ul id="lista"></ul>
    <div id="resumen">Comprobando…</div>

    <script>
        const lista = document.getElementById('lista');
        const resumen = document.getElementById('resumen');
        let fallos = 0;

        function linea(ok, texto) {
            const li = document.createElement('li');
            li.className = ok === true ? 'ok' : ok === false ? 'mal' : 'info';
            li.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : '• ') + texto;
            lista.appendChild(li);
            if (ok === false) fallos++;
        }

        async function pedir(ruta) {
            try {
                const r = await fetch(ruta, { cache: 'no-store' });
                return { ok: r.ok, status: r.status, tipo: r.headers.get('content-type') || '', resp: r };
            } catch (e) {
                return { ok: false, status: 'sin conexion', tipo: '', resp: null };
            }
        }

        function medirImagen(ruta) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img.naturalWidth + 'x' + img.naturalHeight);
                img.onerror = () => resolve(null);
                img.src = ruta + '?t=' + Date.now();
            });
        }

        async function comprobar() {
            // 1) HTTPS
            linea(location.protocol === 'https:', 'La página se sirve por HTTPS (' + location.protocol + ')');

            // 2) index.html enlaza el manifest (indica si subiste el index nuevo)
            const idx = await pedir('/');
            if (idx.ok) {
                const texto = await idx.resp.text();
                linea(/rel=["']manifest["']/.test(texto), 'index.html contiene el enlace al manifest (si falla: sube el index.html nuevo)');
                linea(/serviceWorker\.register/.test(texto), 'index.html registra el service worker');
            } else {
                linea(false, 'No se pudo leer index.html (' + idx.status + ')');
            }

            // 3) manifest.json
            const man = await pedir('/manifest.json');
            linea(man.ok, '/manifest.json responde (' + man.status + ')');
            let manifest = null;
            if (man.ok) {
                try { manifest = await man.resp.json(); } catch (e) { linea(false, 'manifest.json no es un JSON válido'); }
            }

            if (manifest) {
                linea(!!(manifest.name || manifest.short_name), 'El manifest tiene nombre');
                linea(!!manifest.start_url, 'El manifest tiene start_url (' + manifest.start_url + ')');
                linea(['standalone', 'fullscreen', 'minimal-ui'].includes(manifest.display), 'display es "' + manifest.display + '" (debe ser standalone)');

                const iconos = manifest.icons || [];
                const tamanos = iconos.map((i) => i.sizes);
                linea(tamanos.includes('192x192'), 'El manifest declara un icono de 192x192');
                linea(tamanos.includes('512x512'), 'El manifest declara un icono de 512x512');

                // 4) Cada icono debe existir de verdad
                for (const ic of iconos) {
                    const r = await pedir(ic.src);
                    const dim = r.ok ? await medirImagen(ic.src) : null;
                    linea(r.ok && r.tipo.includes('image') && !!dim,
                        ic.src + ' → ' + (r.ok ? 'existe, ' + (dim || 'no es una imagen válida') : 'NO ENCONTRADO (' + r.status + ')'));
                }
            }

            // 5) service worker
            const sw = await pedir('/sw.js');
            linea(sw.ok && sw.tipo.includes('javascript'), '/sw.js responde (' + sw.status + ', ' + (sw.tipo || 'sin tipo') + ')');
            if ('serviceWorker' in navigator) {
                const reg = await navigator.serviceWorker.getRegistration('/');
                linea(!!reg, reg
                    ? 'Service worker registrado (estado: ' + ((reg.active && reg.active.state) || 'instalando') + ')'
                    : 'Service worker AÚN no registrado: abre la página principal una vez y vuelve a esta');
            } else {
                linea(false, 'Este navegador no admite service workers');
            }

            // 6) Estado actual
            const instalada = window.matchMedia('(display-mode: standalone)').matches;
            linea(null, instalada ? 'Estás dentro de la app instalada' : 'Estás en el navegador (no en la app instalada)');
            linea(null, 'Navegador: ' + navigator.userAgent);

            resumen.textContent = fallos === 0
                ? 'Todo correcto. El navegador debería ofrecer "Instalar aplicación" en el menú ⋮ tras abrir la página principal y recargarla una vez. Si ya habías añadido un acceso directo antes, bórralo primero.'
                : 'Hay ' + fallos + ' problema(s) marcados con ✗. Sube o corrige esos ficheros en tu proyecto, vuelve a desplegar y repite esta prueba.';
        }

        comprobar();
    </script>
</body>
</html>
